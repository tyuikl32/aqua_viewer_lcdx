<main class="access-page container py-4">
  @if (eula) {
    <div class="card shadow-sm mx-auto">
      <div class="card-body p-4">
        <h1>{{ eula.title }}</h1>
        <p class="text-secondary">版本 {{ eula.version }} · 发布于 {{ eula.publishedAt | date:'yyyy-MM-dd HH:mm' }}</p>
        <article class="eula-content" [innerHTML]="html"></article>
        <div class="d-flex gap-2 mt-4 sticky-actions">
          <button class="btn btn-primary" [disabled]="accepting" (click)="accept()">同意并继续</button>
          <button class="btn btn-outline-secondary" (click)="logout()">退出登录</button>
        </div>
      </div>
    </div>
  }
</main>
