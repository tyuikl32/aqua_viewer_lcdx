<main class="access-page container py-4">
  @if (loading()) {
    <div class="text-center py-5" role="status">正在加载最终用户许可协议…</div>
  } @else if (loadError()) {
    <div class="alert alert-danger mx-auto" role="alert">
      <h1 class="h4">无法加载最终用户许可协议</h1>
      <p>请检查网络连接后重试。协议加载成功前无法继续使用网页服务。</p>
      <button class="btn btn-outline-danger" type="button" (click)="retry()">重新加载</button>
    </div>
  } @else if (eula(); as document) {
    <div class="card shadow-sm mx-auto">
      <div class="card-body p-4">
        <h1>{{ document.title }}</h1>
        <p class="text-secondary">版本 {{ document.version }} · 发布于 {{ document.publishedAt | date:'yyyy-MM-dd HH:mm' }}</p>
        <article class="eula-content" [innerHTML]="html()"></article>
        <div class="d-flex gap-2 mt-4 sticky-actions">
          <button class="btn btn-primary" [disabled]="accepting()" (click)="accept()">同意并继续</button>
          <button class="btn btn-outline-secondary" (click)="logout()">退出登录</button>
        </div>
      </div>
    </div>
  }
</main>
