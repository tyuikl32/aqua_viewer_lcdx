name: React CI/CD

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the React app
        run: npm run build

      - name: Compress dist folder
        run: tar -czf dist.tar.gz dist/

      - name: Delete old artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --paginate --jq '.artifacts[].id')
          for id in $ids; do
            echo "Deleting artifact $id"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" || true
          done

      - name: Delete failed workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" --paginate --jq '.workflow_runs[] | select(.conclusion == "failure") | .id')
          for id in $ids; do
            echo "Deleting failed run $id"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" || true
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist.tar.gz
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      HAS_DEPLOY_SECRETS: ${{ secrets.REMOTE_HOST != '' && secrets.REMOTE_USER != '' && secrets.SSH_PRIVATE_KEY != '' }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dist

      - name: Copy files to server
        if: env.HAS_DEPLOY_SECRETS == 'true'
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "dist.tar.gz"
          target: "/root/"

      - name: Run deployment script on server
        if: env.HAS_DEPLOY_SECRETS == 'true'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -euo pipefail
            cd /root
            rm -rf dist
            tar -xzf dist.tar.gz
            docker exec nginx rm -rf /var/www/portal
            docker cp /root/dist nginx:/var/www/portal
            echo "Finished React deployment for ${{ github.sha }}"
